name: release-please

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: ".github/release-please/config.json"
          manifest-file: ".github/release-please/manifest.json"
          token: ${{ secrets.PAT_RELEASE_PLEASE }}
